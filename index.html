<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>أبطال الأمن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: patterned green header with gold crest + gold rule, then one centered column of list cards; teacher = recommendations first, then evidence panels */
:root{
  color-scheme:light;
  --page:#FBFAF6; --paper:#FFFFFF; --ink:#1D2A28; --muted:#6B7B77; --line:#ECE6D6; --line2:#E1E9E6;
  --green:#0B5D4E; --green2:#127A66; --green-soft:#E5F1EC;
  --gold:#C9A13B; --gold2:#E8C96A; --gold-soft:#F6EED8; --gold-ink:#8A6A12;
  --safety:#1F6FB2; --disaster:#C2502E; --evac:#1B8354; --bus:#B7860B;
  --ok:#1B8354; --ok-soft:#E3F3EA; --bad:#C23B3B; --bad-soft:#FBE9E9; --warn-soft:#FBF0DD;
  --kufi:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{margin:0;line-height:1.4;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
.hd{background:var(--green);color:#fff;position:relative;overflow:hidden}
.hd::before{content:"";position:absolute;inset:0;opacity:.13;pointer-events:none;
  background-image:radial-gradient(circle at 50% 50%,transparent 9px,#fff 10px,transparent 11px),linear-gradient(45deg,transparent 46%,#fff 47% 53%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 47% 53%,transparent 54%);background-size:34px 34px}
.hdin{position:relative;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.switch{align-self:flex-start;display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px;margin-bottom:6px}
.switch button{border:0;background:none;border-radius:999px;padding:4px 14px;font-weight:600;color:#fff;font-size:.82rem;opacity:.8}
.switch button[aria-pressed="true"]{background:#fff;color:var(--green);opacity:1}
.crest{width:68px;height:68px;border-radius:50%;background:var(--gold);border:3px solid #fff;display:grid;place-items:center;font-size:2rem;margin-bottom:6px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.hd h1{font-family:var(--kufi);font-weight:800;font-size:1.65rem}
.hd p{font-size:.85rem;opacity:.88}
.hd.compact .crest{display:none}
.hd.compact .hdin{padding-block:12px 16px}
.hd.compact h1{font-size:1.25rem}
.goldline{height:5px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}

/* ---------- footer ---------- */
.ft{margin-top:auto;background:#fff;border-top:1px solid var(--line2);text-align:center;padding-inline:16px;padding-block:14px;font-size:.84rem;color:var(--muted);line-height:1.8}
.ft .sch{font-family:var(--kufi);font-weight:700;color:var(--green);font-size:.92rem}
.ft b{color:var(--green)}
.ft .ppl{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 16px}

/* ---------- student ---------- */
.wrap{width:100%;max-width:600px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--kufi);font-weight:700;font-size:1.2rem}
.intro{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.intro h2{font-family:var(--kufi);font-weight:700;font-size:1.15rem;color:var(--green)}
.intro p{color:var(--muted);font-size:.92rem;max-width:44ch}
.emos{display:flex;gap:8px;justify-content:center}
.emos span{width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:1.4rem}
.field{display:flex;flex-direction:column;gap:7px}
.lbl{font-weight:600;font-size:.93rem}
.input{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;width:100%;font-size:1rem}
.input:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--green-soft)}
.seg{display:grid;gap:8px}
.seg.two{grid-template-columns:1fr 1fr}
.seg.six{grid-template-columns:repeat(3,1fr)}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 6px;font-weight:600;font-size:.95rem;line-height:1.35}
.seg button small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}
.seg button[aria-pressed="true"] small{color:#CFE5DE}
.btn-p{border:0;background:var(--green);color:#fff;border-radius:12px;padding:13px 18px;font-weight:700;font-size:1.05rem;font-family:var(--kufi)}
.btn-p:hover{background:var(--green2)}
.btn-p:disabled{background:#BCCBC6;cursor:not-allowed}
.btn-s{border:1.5px solid var(--line);background:#fff;color:var(--green);border-radius:12px;padding:12px 18px;font-weight:700;font-size:1rem;font-family:var(--kufi)}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.86rem;padding:0;align-self:center}

.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:4px}
.hello b{display:block;font-family:var(--kufi);font-size:1.15rem;font-weight:700}
.hello small{color:var(--muted);font-size:.86rem}
.ring{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--page);display:grid;place-items:center;font-weight:700;font-size:.82rem;color:var(--green);line-height:1.2;text-align:center}
.list{display:flex;flex-direction:column;gap:10px}
.row{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:16px;padding:12px 14px;text-align:start}
.row:hover:not(:disabled){box-shadow:0 3px 10px rgba(11,93,78,.08)}
.row .emo{font-size:1.75rem;flex:none;width:40px;text-align:center}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-family:var(--kufi);font-weight:700;font-size:1rem}
.row small{display:block;color:var(--muted);font-size:.8rem;line-height:1.5}
.pill{flex:none;font-style:normal;font-size:.76rem;font-weight:700;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.go{background:var(--gold-soft);color:var(--gold-ink)}
.pill.lock{background:#F1F1EE;color:var(--muted)}
.row.cert{--c:var(--gold);background:linear-gradient(90deg,#fff,var(--gold-soft))}
.row:disabled{cursor:default}
.row:disabled .emo{filter:grayscale(.6);opacity:.7}
.hint{text-align:center;color:var(--muted);font-size:.84rem}

.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:600;color:var(--muted)}
.qtop .cat{display:flex;align-items:center;gap:6px;color:var(--c);font-family:var(--kufi);font-weight:700;font-size:.95rem}
.qbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px}
.qtext{font-family:var(--kufi);font-weight:700;font-size:1.18rem;line-height:1.75}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:start;font-weight:500;font-size:1rem;display:flex;align-items:center;gap:12px}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-weight:700}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong b{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.note{border-radius:14px;padding:12px 14px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.note .emo{font-size:1.3rem;line-height:1.5}
.note strong{display:block}
.note.ok{background:var(--ok-soft)}
.note.info{background:var(--gold-soft)}

.result{align-items:center;text-align:center}
.score{position:relative;width:140px;height:140px;border-radius:50%;display:grid;place-items:center}
.score div{width:112px;height:112px;border-radius:50%;background:#fff;display:grid;place-content:center;line-height:1.15}
.score strong{font-family:var(--kufi);font-size:2.4rem;font-weight:800;color:var(--green)}
.score span{font-size:.82rem;color:var(--muted)}
.result h2{font-size:1.3rem}
.badge{display:flex;align-items:center;gap:10px;background:var(--green-soft);border-radius:14px;padding:10px 14px;font-weight:600;color:var(--green)}
.badge span{font-size:1.5rem}
.save{font-size:.84rem;color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap;width:100%}
.btns>*{flex:1;min-width:140px}

.certi{background:#fff;border:3px double var(--gold);border-radius:18px;overflow:hidden;text-align:center}
.certi .top{background:var(--green);color:#fff;padding:18px 14px 14px;position:relative}
.certi .top::before{content:"";position:absolute;inset:0;opacity:.13;background-image:radial-gradient(circle at 50% 50%,transparent 9px,#fff 10px,transparent 11px),linear-gradient(45deg,transparent 46%,#fff 47% 53%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 47% 53%,transparent 54%);background-size:34px 34px}
.certi .top *{position:relative}
.certi .top .crest{margin:0 auto 4px;width:58px;height:58px;font-size:1.6rem}
.certi .top b{font-family:var(--kufi);font-size:1.25rem;display:block}
.certi .top small{opacity:.85;font-size:.8rem}
.certi .body{padding:18px 16px 20px;display:flex;flex-direction:column;gap:8px;align-items:center}
.certi .nm{font-family:var(--kufi);font-weight:800;font-size:1.7rem;color:var(--green);border-bottom:2px solid var(--gold);padding-inline:14px;line-height:1.6}
.certi .body p{color:var(--muted);font-size:.92rem}
.certi .seal{font-size:1.6rem;letter-spacing:6px}
.certi .sign{display:flex;justify-content:space-around;width:100%;gap:12px;margin-top:8px;font-size:.82rem;color:var(--muted)}
.certi .sign div{display:flex;flex-direction:column;align-items:center}
.certi .sign b{color:var(--green);font-size:.92rem}
@media (prefers-reduced-motion:no-preference){.qbar i{transition:width .3s}.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}}

/* ---------- teacher ---------- */
.dash{width:100%;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--kufi);font-weight:700;font-size:1.02rem}
.panel .sub{color:var(--muted);font-size:.84rem;margin-top:-8px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h1{font-family:var(--kufi);font-weight:800;font-size:1.3rem;color:var(--green)}
.dhead p{color:var(--muted);font-size:.86rem}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 13px;font-weight:600;font-size:.86rem;color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
.filters select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);font-size:.93rem}
.recs{display:flex;flex-direction:column;gap:10px}
.rec{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border-radius:14px;padding:12px 14px;border:1px solid var(--line);border-inline-start:5px solid var(--lv)}
.rec .ic{font-size:1.4rem;line-height:1.4}
.rec b{display:block;font-weight:700;font-size:.98rem}
.rec p{font-size:.9rem;color:#3E4C49}
.rec .msg{margin-top:6px;background:var(--gold-soft);border-radius:10px;padding:8px 10px;font-size:.86rem;color:var(--gold-ink)}
.rec.high{--lv:var(--bad);background:#FFFAFA}
.rec.mid{--lv:var(--gold)}
.rec.good{--lv:var(--ok);background:#FAFDFB}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{gap:8px}.kpi{padding:10px}.kpi strong{font-size:1.4rem}.kpi span,.kpi em{font-size:.72rem}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:0;min-width:0}
.kpi span{font-size:.8rem;font-weight:600;color:var(--muted)}
.kpi strong{font-family:var(--kufi);font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.5;color:var(--green)}
.kpi em{font-style:normal;font-size:.78rem;color:var(--muted)}
.kpi.warn strong{color:var(--bad)}
.kpi.gold{background:var(--gold-soft);border-color:#EAD9A8}
.kpi.gold strong{color:var(--gold-ink)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.g2{grid-template-columns:1fr}}
.bars{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;font-size:.86rem;font-weight:600}
.br.w{grid-template-columns:130px 1fr auto}
.br .tr{height:14px;background:#F1EEE5;border-radius:7px;overflow:hidden}
.br .tr i{display:block;height:100%;border-radius:7px}
.br em{font-style:normal;text-align:end;font-variant-numeric:tabular-nums;min-width:44px;color:var(--muted)}
.br em b{color:var(--ink)}
details.sizes summary{cursor:pointer;font-weight:600;font-size:.86rem;color:var(--green)}
.szgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:480px){.szgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.szgrid label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted)}
.szgrid input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;font-size:.95rem}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;width:100%;font-size:.88rem}
th{font-size:.76rem;color:var(--muted);font-weight:600;text-align:center;padding:4px}
th:first-child{text-align:start}
td{padding:7px 6px;text-align:center;border-radius:8px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{text-align:start;font-weight:700}
.plain td{background:#FAF8F2;text-align:start;white-space:normal}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.hq{display:flex;flex-direction:column}
.hq>div{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.hq>div:last-child{border-bottom:0}
.hq .t{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;font-weight:600}
.hq .t strong{flex:none;font-variant-numeric:tabular-nums}
.hq small{color:var(--muted);font-size:.8rem}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:700;color:#fff;background:var(--c);margin-inline-end:6px}
.heroes{display:flex;flex-wrap:wrap;gap:8px}
.hero{display:flex;align-items:center;gap:6px;border:1px solid #EAD9A8;background:var(--gold-soft);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.88rem}
.hero small{color:var(--gold-ink);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:16px 8px;font-size:.9rem}
.demo{background:var(--gold-soft);border:1px solid #EAD9A8;border-radius:12px;padding:10px 14px;font-weight:600;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gate{max-width:420px;margin:0 auto;width:100%}
.gate input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:1rem}
.err{color:var(--bad);font-size:.88rem;font-weight:600}
.ok-msg{color:var(--ok);font-size:.84rem;font-weight:600}

/* ---------- titles (ألقاب) ---------- */
.ttl{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:2px 12px;font-weight:700;font-size:.84rem;margin-top:4px}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.7rem;color:var(--muted);line-height:1.35}
.step span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:#F1F1EE;filter:grayscale(1);opacity:.55}
.step.on span{background:var(--gold-soft);filter:none;opacity:1}
.step.cur span{background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.step.cur{color:var(--ink);font-weight:700}
.next{font-size:.84rem;color:var(--muted);text-align:center}
.next b{color:var(--gold-ink)}
.newttl{display:flex;align-items:center;gap:10px;justify-content:center;background:linear-gradient(90deg,var(--gold-soft),#fff,var(--gold-soft));border:1px solid #EAD9A8;border-radius:14px;padding:10px 14px;font-weight:700;color:var(--gold-ink);width:100%}
.newttl span{font-size:1.6rem}

/* ---------- teacher simplification ---------- */
.summary{background:var(--green-soft);border-radius:14px;padding:12px 14px;font-weight:600;color:var(--green);font-size:.95rem;line-height:1.8}
.how{font-size:.8rem;color:var(--muted);background:#FAF8F2;border-radius:10px;padding:6px 10px}
.rec .step-no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem;margin-top:2px}
details.more summary{cursor:pointer;font-weight:600;font-size:.86rem;color:var(--green)}
details.more .recs{margin-top:10px}
.kpi.up strong{color:var(--ok)}
</style>
</head>
<body>
<header class="hd" id="hd"><div class="hdin">
  <nav class="switch" aria-label="التنقل"><button id="tabStudent" aria-pressed="true">الطلاب</button><button id="tabTeacher" aria-pressed="false">المعلمة</button></nav>
  <div class="crest" aria-hidden="true">⛑️</div>
  <h1>أبطال الأمن</h1>
  <p>مدرسة سكينة بنت أبي وقاص · الأمن والسلامة المدرسية</p>
</div><div class="goldline"></div></header>
<main id="app"></main>
<footer class="ft">
  <div class="sch">مدرسة سكينة بنت أبي وقاص</div>
  <div class="ppl"><span>مديرة المدرسة: <b>أ/ نبيلة تكر</b></span><span>إعداد: <b>أ/ بدرية الحجيلي</b></span></div>
</footer>

<script>
/* =========================================================
   ⚙️ الإعداد: الصقي هنا رابط Web app من Google Apps Script
   لازم ينتهي بـ /exec
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbxiWpTLvPA9PjXhmeP9_k6OfMXMEDb7tU51T0NA4vRbyfuFW5kH3NsbJjsW3bdzaxtQcQ/exec';

/* ---------- helpers ---------- */
const AR='٠١٢٣٤٥٦٧٨٩';
const ar=s=>String(s).replace(/\d/g,d=>AR[d]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ---------- Google Sheets ---------- */
async function sendToSheet(rec){
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',record:rec})});
  const j=await res.json(); if(!j.ok) throw new Error(j.error||'save failed');
}
async function flushPending(){
  if(!apiReady())return;
  const pending=ls.get('abtal.pending',[]); if(!pending.length)return;
  const left=[]; for(const r of pending){try{await sendToSheet(r)}catch(e){left.push(r)}}
  ls.set('abtal.pending',left);
}
async function saveResult(rec){
  localResults.push(rec); ls.set('abtal.results',localResults);
  if(!apiReady()){lastSave='محفوظة على هذا الجهاز فقط (الموقع غير مربوط بالشيت بعد)';return}
  try{await sendToSheet(rec);lastSave='✓ وصلت نتيجتك للمعلمة'}
  catch(e){const p=ls.get('abtal.pending',[]);p.push(rec);ls.set('abtal.pending',p);lastSave='محفوظة على جهازك، وتوصل للمعلمة أول ما يرجع الإنترنت'}
}
async function loadResults(key){
  const res=await fetch(API_URL+'?action=results&key='+encodeURIComponent(key));
  const j=await res.json(); if(!j.ok) throw new Error(j.error||'error');
  return j.results;
}
flushPending(); window.addEventListener('online',flushPending);

function myBest(){
  const b={}; if(!student)return b; const k=skey(student);
  localResults.filter(r=>r.studentKey===k).forEach(r=>{b[r.cat]=Math.max(b[r.cat]??0,r.score)});
  return b;
}

/* ---------- teacher: data ---------- */
function allResults(){return useDemo?(demoCache||(demoCache=makeDemo())):remoteResults}
const avg=a=>a.length?Math.round(a.reduce((x,r)=>x+r.score/6*100,0)/a.length):null;
const lvlColor=v=>v===null?'#E8E4D8':v>=80?'#1B8354':v>=60?'#C9A13B':'#C23B3B';
function heat(v){if(v===null)return 'background:#F5F3EC;color:#B3AE9F';return v>=80?'background:#DDF1E5;color:#11683A':v>=60?'background:#F6EED8;color:#7A5A00':'background:#F9DEDE;color:#A3242A'}
const CLASSES=[];GRADES.slice().reverse().forEach(g=>SECTIONS.forEach(s=>CLASSES.push({k:g+s,g,s,l:classLabel(g,s)})));
const plural=(n,one,two,many)=>n===1?one:n===2?two:ar(n)+' '+many;

function compute(){
  const rs=allResults();
  const inScope=r=>(F.cls==='all'||r.grade+r.section===F.cls)&&(F.gender==='all'||r.gender===F.gender);
  const scope=rs.filter(inScope);
  const studs={};
  scope.forEach(r=>{const s=studs[r.studentKey]||(studs[r.studentKey]={name:r.name,gender:r.gender,grade:r.grade,section:r.section,best:{}});s.best[r.cat]=Math.max(s.best[r.cat]??0,r.score)});
  const list=Object.values(studs);
  const heroes=list.filter(s=>CATS.every(c=>(s.best[c.id]??0)>=HERO_MIN));
  const follow=list.map(s=>({...s,weak:CATS.filter(c=>s.best[c.id]!==undefined&&s.best[c.id]<=WEAK_MAX)})).filter(s=>s.weak.length);
  const classes=(F.cls==='all'?CLASSES:CLASSES.filter(c=>c.k===F.cls)).map(c=>{
    const rr=rs.filter(r=>r.grade+r.section===c.k&&(F.gender==='all'||r.gender===F.gender));
    const n=new Set(rr.map(r=>r.studentKey)).size, size=+sizes[c.k]||0;
    return {...c,n,size,part:size?Math.min(100,pct(n,size)):null,avg:avg(rr),cat:Object.fromEntries(CATS.map(k=>{const a=rr.filter(r=>r.cat===k.id);return [k.id,{v:avg(a),n:a.length}]}))};
  });
  const catAvg=CATS.map(c=>{const a=scope.filter(r=>r.cat===c.id);return {c,v:avg(a),n:a.length,people:new Set(a.map(r=>r.studentKey)).size}});
  const qs=[];CATS.forEach(c=>{const a=scope.filter(r=>r.cat===c.id);if(!a.length)return;
    c.qs.forEach((q,i)=>{const ok=a.filter(r=>Number(r.answers[i])===1).length;qs.push({c,q,ok,p:pct(ok,a.length),n:a.length})})});
  qs.sort((a,b)=>a.p-b.p);
  const gGap=CATS.map(c=>{const m=rs.filter(r=>(F.cls==='all'||r.grade+r.section===F.cls)&&r.gender==='m'&&r.cat===c.id),f=rs.filter(r=>(F.cls==='all'||r.grade+r.section===F.cls)&&r.gender==='f'&&r.cat===c.id);
    return {c,m:avg(m),f:avg(f),ok:m.length>=5&&f.length>=5}});
  const totalSize=classes.reduce((a,c)=>a+c.size,0), sizedN=classes.filter(c=>c.size).reduce((a,c)=>a+c.n,0);
  // التحسن: أول محاولة مقابل آخر محاولة لنفس الطالب في نفس المحور (مثل الاختبار القبلي والبعدي)
  const tries={};scope.forEach(r=>{(tries[r.studentKey+'#'+r.cat]||(tries[r.studentKey+'#'+r.cat]=[])).push(r)});
  const pairs=Object.values(tries).filter(a=>a.length>=2).map(a=>{a.sort((x,y)=>x.ts-y.ts);return {first:a[0].score,last:a[a.length-1].score}});
  const imp=pairs.length?{first:Math.round(pairs.reduce((s,p)=>s+p.first,0)/pairs.length/6*100),last:Math.round(pairs.reduce((s,p)=>s+p.last,0)/pairs.length/6*100),n:pairs.length,people:new Set(Object.entries(tries).filter(([,a])=>a.length>=2).map(([k])=>k.split('#')[0])).size}:null;
  if(imp)imp.gain=imp.last-imp.first;
  // توزيع الألقاب حسب عدد الشارات
  const titles=TITLES.map(()=>0);list.forEach(s=>{titles[CATS.filter(c=>(s.best[c.id]??0)>=HERO_MIN).length]++});
  return {rs,scope,list,heroes,follow,classes,catAvg,qs,gGap,totalSize,sizedN,all:avg(scope),imp,titles};
}

/* ---------- teacher: recommendations ---------- */
function recommend(d){
  // كل توصية: عنوان = وش تسوين، وجملة وحدة = ليش. مرتبة من الأهم للأقل.
  const R=[];
  if(!d.scope.length)return R;
  const ranked=d.catAvg.filter(x=>x.v!==null&&x.n>=3).sort((a,b)=>a.v-b.v);
  // 1) أضعف محور + رسالة جاهزة للإذاعة
  if(ranked.length&&ranked[0].v<80){
    const w=ranked[0], hq=d.qs.filter(x=>x.c.id===w.c.id).slice(0,2);
    R.push({lv:w.v<60?'high':'mid',ic:'🎙️',t:`خصّصي الإذاعة القادمة لـ «${w.c.name}»`,p:`هو أضعف محور (${ar(w.v)}٪ إجابات صحيحة). أكثر سؤال غلطوا فيه: «${hq[0].q.q}»`,msg:`📢 اقرئي في الإذاعة: ${hq[0].q.w}${hq[1]&&hq[1].p<70?' '+hq[1].q.w:''}`});
  }
  // 2) فصول تحتاج حصة توعية
  const cells=[];d.classes.forEach(cl=>CATS.forEach(c=>{const x=cl.cat[c.id];if(x.v!==null&&x.n>=3&&x.v<60)cells.push({cl,c,v:x.v})}));
  cells.sort((a,b)=>a.v-b.v);
  if(cells.length)R.push({lv:'high',ic:'🏫',t:`حصة توعية قصيرة (١٠ دقائق) ${cells.length===1?'لفصل واحد':'لهذه الفصول'}`,p:cells.slice(0,3).map(x=>`فصل ${x.cl.l}: ${x.c.name}`).join(' · ')+(cells.length>3?` · و${ar(cells.length-3)} غيرها في الجدول تحت.`:'')});
  // 3) المشاركة
  if(d.totalSize){
    const low=d.classes.filter(c=>c.size&&c.part<50).sort((a,b)=>a.part-b.part);
    if(low.length)R.push({lv:'high',ic:'📣',t:`أرسلي رابط الموقع ${low.length===1?'لفصل':'لفصول'} ${low.slice(0,4).map(c=>c.l).join('، ')}${low.length>4?' وغيرها':''}`,p:'شارك فيها أقل من نصف الطلاب.'});
  }else R.push({lv:'mid',ic:'🧮',t:'أدخلي عدد الطلاب في كل فصل (مرة وحدة بس)',p:'عشان تعرفين أي فصل ما شارك. تلقينها تحت في «مشاركة الفصول».'});
  // 4) محاور ما حلّوها
  const notTried=d.catAvg.filter(x=>d.list.length>=5&&x.people<d.list.length*0.6);
  if(notTried.length)R.push({lv:'mid',ic:'⏳',t:`شجعيهم يحلّون ${notTried.map(x=>'«'+x.c.name+'»').join(' و')}`,p:`حلّه ${notTried.map(x=>`${ar(x.people)} بس من ${ar(d.list.length)}`).join(' و')}.`});
  // 5) الفرق بين الطلاب والطالبات
  if(F.gender==='all'){const g=d.gGap.filter(x=>x.ok&&Math.abs(x.m-x.f)>=15).sort((a,b)=>Math.abs(b.m-b.f)-Math.abs(a.m-a.f))[0];
    if(g){const weakF=g.f<g.m;R.push({lv:'mid',ic:'⚖️',t:`نشاط عن «${g.c.name}» ${weakF?'للطالبات':'للطلاب'}`,p:`${weakF?'الطالبات':'الطلاب'} أقل بـ ${ar(Math.abs(g.m-g.f))} نقطة في هذا المحور.`})}}
  // 6) إعادة المحاولة (التحسن)
  if(d.imp&&d.imp.n>=3){
    if(d.imp.gain>=10)R.push({lv:'good',ic:'📈',t:'شجعيهم يعيدون المحاولة',p:`اللي أعادوا ارتفعت درجتهم من ${ar(d.imp.first)}٪ إلى ${ar(d.imp.last)}٪. الإعادة تثبّت المعلومة.`});
  }
  // 7) التكريم
  if(d.heroes.length)R.push({lv:'good',ic:'🏆',t:`كرّمي ${plural(d.heroes.length,'بطل الأمن','بطلَي الأمن','أبطال أمن')} في الطابور`,p:'أسماؤهم في آخر الصفحة.'});
  const best=ranked[ranked.length-1];
  if(best&&best.v>=80&&ranked.length>1)R.push({lv:'good',ic:'✅',t:`«${best.c.name}» ممتاز، ما يحتاج شي حالياً`,p:`${ar(best.v)}٪ إجابات صحيحة.`});
  const order={high:0,mid:1,good:2};
  return R.map((r,i)=>({...r,i})).sort((a,b)=>order[a.lv]-order[b.lv]||a.i-b.i);
}
// ملخص بجملة وحدة أعلى اللوحة
function summaryLine(d){
  const lvl=v=>v>=80?'ممتاز':v>=60?'جيد':'يحتاج تعزيز';
  const ranked=d.catAvg.filter(x=>x.v!==null).sort((a,b)=>a.v-b.v);
  let s=`باختصار: المستوى العام <b>${lvl(d.all)}</b> (${ar(d.all)}٪ إجابات صحيحة)`;
  if(ranked.length>1)s+=`، أقوى محور «${ranked[ranked.length-1].c.name}» وأضعفها «${ranked[0].c.name}»`;
  s+='.';
  if(d.imp&&d.imp.n>=3&&d.imp.gain>0)s+=` اللي أعادوا المحاولة تحسنوا بـ ${ar(d.imp.gain)} نقطة.`;
  return s;
}

function makeDemo(){

  const mN=['محمد','عبدالله','فيصل','سعود','يوسف','خالد','عمر','تركي','نواف','سلمان'],fN=['سارة','نورة','ريم','لمى','جود','هيا','رهف','دانة','ليان','شهد'],fam=['العتيبي','الحربي','القحطاني','الجهني','الشمري','المطيري'];
  const out=[];
  GRADES.forEach(g=>SECTIONS.forEach(s=>{const n=g===3&&s==='ب'?3:6+Math.floor(rnd()*8);for(let k=0;k<n;k++){const gen=rnd()<.5?'m':'f';const name=(gen==='m'?mN:fN)[Math.floor(rnd()*10)]+' '+fam[Math.floor(rnd()*6)]+(k>9?' '+ar(k):'');
    CATS.forEach(c=>{if(rnd()<(c.id==='bus'?.4:.15))return;const skill=.5+g*.07+(c.id==='bus'?-.15:0)+(c.id==='safety'?.06:0)+(s==='ب'?-.05:0)+(c.id==='disaster'&&gen==='f'?-.12:0);const answers=c.qs.map((_,i)=>rnd()<skill-(i===4?.2:0)?1:0);
      const ts=Date.now()-Math.floor(rnd()*864e6), sc=answers.reduce((a,b)=>a+b,0);
      out.push({id:'demo'+out.length,name,gender:gen,grade:g,section:s,studentKey:name+'|'+gen+'|'+g+s,cat:c.id,answers,score:sc,ts});
      if(sc<HERO_MIN&&rnd()<.45){const a2=answers.map(v=>v||rnd()<.55?1:0);out.push({id:'demo'+out.length,name,gender:gen,grade:g,section:s,studentKey:name+'|'+gen+'|'+g+s,cat:c.id,answers:a2,score:a2.reduce((a,b)=>a+b,0),ts:ts+36e5})}})}}));
  return out;
}

/* ---------- CSV ---------- */
function exportCSV(){
  const d=compute();
  const head=['الاسم','النوع','الصف','الشعبة','الفصل','المحور','الدرجة','من','النسبة','التاريخ','س1','س2','س3','س4','س5','س6'];
  const lines=d.scope.map(r=>[r.name,r.gender==='f'?'طالبة':'طالب',r.grade,r.section,r.grade+r.section,CAT[r.cat].name,r.score,6,Math.round(r.score/6*100),new Date(r.ts).toISOString().slice(0,10),...r.answers].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+head.join(',')+'\n'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='abtal-alamn-results.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- render + events ---------- */
function render(){
  $('#tabStudent').setAttribute('aria-pressed',tab==='student');$('#tabTeacher').setAttribute('aria-pressed',tab==='teacher');
  $('#hd').classList.toggle('compact',tab==='teacher'||view==='quiz');
  const app=$('#app');
  if(tab==='teacher'){app.innerHTML=teacherOpen?vDash():vGate();return}
  app.innerHTML=`<div class="wrap">${view==='quiz'?vQuiz():view==='result'?vResult():view==='cert'&&student?vCert():vHome()}</div>`;
}
const go=v=>{view=v;render();scrollTo(0,0)};
$('#tabStudent').onclick=()=>{tab='student';render()};
$('#tabTeacher').onclick=()=>{tab='teacher';render()};
document.addEventListener('input',e=>{if(e.target.id==='nm'){reg.name=e.target.value;const b=$('#go');if(b)b.disabled=!regOk()}});
document.addEventListener('change',e=>{
  if(e.target.id==='fCls'){F.cls=e.target.value;render()}
  if(e.target.id==='fG'){F.gender=e.target.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')$('#pinGo').click()});
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t||!$('#app').contains(t))return;
  if(t.dataset.g){reg.gender=t.dataset.g;render()}
  else if(t.dataset.gr){reg.grade=+t.dataset.gr;render()}
  else if(t.dataset.sec){reg.section=t.dataset.sec;render()}
  else if(t.id==='go'){student={name:reg.name.trim().replace(/\s+/g,' '),gender:reg.gender,grade:reg.grade,section:reg.section};ls.set('abtal.student',student);go('home')}
  else if(t.id==='logout'){student=null;ls.del('abtal.student');reg={name:'',gender:null,grade:null,section:null};go('home')}
  else if(t.dataset.cat){quiz={cat:t.dataset.cat,i:0,answers:[]};go('quiz')}
  else if(t.dataset.o!==undefined&&quiz){quiz.answers[quiz.i]=+t.dataset.o;render()}
  else if(t.id==='quit'){go('home')}
  else if(t.id==='next'){
    if(quiz.i<5){quiz.i++;go('quiz');return}
    quiz.prevN=earned(myBest());
    const c=CAT[quiz.cat];const answers=c.qs.map((q,i)=>quiz.answers[i]===q.a?1:0);quiz.score=answers.reduce((a,b)=>a+b,0);
    const rec={id:uid(),name:student.name,gender:student.gender,grade:student.grade,section:student.section,studentKey:skey(student),cat:quiz.cat,answers,score:quiz.score,ts:Date.now()};
    localResults.push(rec);lastSave='';go('result');localResults.pop();
    await saveResult(rec);if(view==='result')render()}
  else if(t.id==='again'){quiz={cat:quiz.cat,i:0,answers:[]};go('quiz')}
  else if(t.id==='cert'){go('cert')}
  else if(t.id==='home'){go('home')}
  else if(t.id==='pinGo'){
    const key=$('#pin').value.trim();
    if(!apiReady()){const er=$('#pinErr');er.textContent='اربطي الموقع بالشيت أولاً.';er.hidden=false;return}
    loading=true;render();
    try{remoteResults=await loadResults(key);teacherKey=key;teacherOpen=true;useDemo=false;loading=false;render()}
    catch(ex){loading=false;render();const er=$('#pinErr');er.textContent=ex.message==='wrong key'?'الرمز غير صحيح.':'تعذّر الاتصال، تأكدي من الإنترنت ومن رابط Web app.';er.hidden=false}}
  else if(t.id==='refresh'){t.disabled=true;try{remoteResults=await loadResults(teacherKey)}catch(ex){}render()}
  else if(t.id==='demoOn'){useDemo=true;render()}
  else if(t.id==='demoOff'){useDemo=false;render()}
  else if(t.id==='csv'){exportCSV()}
  else if(t.id==='saveSizes'){CLASSES.forEach(c=>{const v=parseInt($('#sz-'+c.k).value,10);if(v>0)sizes[c.k]=v;else delete sizes[c.k]});ls.set('abtal.sizes',sizes);sizesSaved=true;render();setTimeout(()=>{sizesSaved=false},4000)}
});
render();
</script>
